<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="HoodX " />
    <meta name="robots" content="noindex, nofollow" />
    <title>HoodX </title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./galaxy.js" defer></script>
  </head>
  <body class="motion-static">
    <canvas id="galaxy-field" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="space-details" aria-hidden="true">
      <span class="binary-fragment fragment-one" data-binary>01001000 01011000</span>
      <span class="binary-fragment fragment-two" data-binary>00110001 01001111</span>
      <span class="binary-fragment fragment-three" data-binary>01000110 01001001</span>
      <span class="meteor meteor-one"></span><span class="meteor meteor-two"></span>
    </div>

    <div class="page">
      <main>
        <div class="message" id="message">
          <div class="signal" aria-hidden="true"><span></span><span></span><span></span></div>
          <h1 class="project-name" id="project-name" data-text="HoodX" aria-label="HoodX">
            <span class="name-face" id="name-face" aria-hidden="true">HoodX</span>
          </h1>
          <div class="signal-rule" aria-hidden="true"><span></span></div>
          <p class="attribution">
  You were not supposed to<br />
  <span class="attribution-brand">find this.</span>
</p>
          <div class="cipher-line" aria-hidden="true">
            <span class="cipher-bracket">[</span><span id="cipher">01001000 01001111 01011000</span><span class="cursor-block"></span><span class="cipher-bracket">]</span>
          </div>
        </div>
      </main>
      <footer>
        <div class="footer-line" aria-hidden="true"></div>
        <a class="credit" href="" target="_blank" rel="noopener noreferrer" aria-label="Powered By BunnyHood — visit BunnyHood on X (opens in a new tab)">
          <span class="powered"></span><span class="brand"></span>
          <svg class="x-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-7.42L5.58 22H2.45l7.22-8.25L1.8 2h6.4l4.42 6.72L18.9 2Zm-1.09 18h1.73L7.26 3.88H5.4L17.81 20Z"/></svg>
        </a>
      </footer>
    </div>
  </body>
</html>
